<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Search</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@200..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body>

    <header class="header">
        <h1> Movie Search App</h1>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="cari film" autocomplete="off">
        </div>
    </header>
    <main>
        <section class="movie-section">
            <div id="movieList" class="movie-list">
            </div>
            <div id="loading" class="loading hidden">
                <div class="spinner"></div>
                <p>Mencari film...</p>
            </div>
            <p id="message" class="message">
                Ketik judul film untuk mencari
            </p>
        </section>
    </main>
    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <button id="classModal" class="close-button">
                &times;
            </button>
            <div id="modalBody"></div>
        </div>
    </div>




    <script type="module" src="./js/main.js"></script>
</body>

</html>
